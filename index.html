<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Perun</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #1a1a2e;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-title {
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }
    #loading-bar-bg {
      width: min(320px, 60vw);
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #7c83ff;
      border-radius: 2px;
      transition: width 0.15s ease;
    }
    #back-to-hub {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      color: rgba(224, 224, 224, 0.35);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    #back-to-hub:hover {
      color: rgba(224, 224, 224, 0.85);
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-title">Perun</div>
    <div id="loading-bar-bg"><div id="loading-bar-fill"></div></div>
  </div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <a id="back-to-hub" href="/doors" aria-label="Back to hub">&larr; Doors</a>
  <script>
    // Collect all AudioContexts Unity creates so we can resume them on first user gesture
    (function () {
      var pendingContexts = [];
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      function Patched() {
        var ctx = new Orig();
        if (ctx.state === "suspended") pendingContexts.push(ctx);
        return ctx;
      }
      Patched.prototype = Orig.prototype;
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;

      function resumeAll() {
        pendingContexts.forEach(function (c) { if (c.state === "suspended") c.resume(); });
        pendingContexts = [];
        document.removeEventListener("click", resumeAll);
        document.removeEventListener("keydown", resumeAll);
        document.removeEventListener("touchstart", resumeAll);
      }
      document.addEventListener("click", resumeAll);
      document.addEventListener("keydown", resumeAll);
      document.addEventListener("touchstart", resumeAll);
    })();
  </script>
  <script src="Build/WebGL-Prod.loader.js"></script>
  <script>
    var fill = document.getElementById("loading-bar-fill");
    var overlay = document.getElementById("loading-overlay");

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl:            "Build/WebGL-Prod.data.unityweb",
      frameworkUrl:       "Build/WebGL-Prod.framework.js.unityweb",
      codeUrl:            "Build/WebGL-Prod.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "Perun",
      productName:        "Perun",
      productVersion:     "0.1.0",
      matchWebGLToCanvasSize: true,
    }, function (progress) {
      fill.style.width = (progress * 100) + "%";
    }).then(function (instance) {
      overlay.classList.add("hidden");
      setTimeout(function () { overlay.remove(); }, 500);
    }).catch(function (message) {
      alert(message);
    });
  </script>
</body>
</html>
